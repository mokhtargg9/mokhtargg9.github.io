function vDet(){const v=VL.find(x=>x.id===apv);if(!v){apv=null;return ""}editing=true;
 const I=(id,l,val,t="text")=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(val)}">`;
 return `<button class="btn o s" onclick="apv=null;vAdmin()">→ رجوع</button><h3>تفاصيل المتجر</h3><div class="card">${v.img?`<img src="${v.img}" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover" onclick="zoom(this.src)">`:""}${I("e_n","اسم المتجر",v.name)}<label>القسم</label><select id="e_c">${AC().map(c=>`<option value="${c[0]}" ${v.cat===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select><label>المدينة</label><select id="e_t">${CITIES.map(c=>`<option ${v.city===c?"selected":""}>${c}</option>`).join("")}</select>${I("e_a","الحي / العنوان",v.area)}${I("e_p","الهاتف",v.phone,"tel")}<div class="mut">صاحب الحساب: ${esc(v.owner||"")}</div>${I("e_l","الترخيص (وصف)",v.license)}<label>صورة الترخيص (اضغط للتكبير)</label>${v.lic?`<img src="${v.lic}" style="width:100%;border-radius:12px" onclick="zoom(this.src)">`:"<p class=mut>ما في صورة</p>"}${I("e_m","نسبة الإدارة %",v.comm||10,"number")}<div class="row"><button class="btn" onclick="vSave(false)">حفظ التعديل</button><button class="btn g" onclick="vSave(true)">${v.status==="approved"?"حفظ":"قبول واعتماد"}</button><button class="btn o" onclick="if(confirm('حذف المتجر؟')){db.doc('vendors/${v.id}').delete();apv=null;vAdmin()}">رفض / حذف</button></div></div>`}
async function vSave(ok){const u={name:$("#e_n").value.trim(),cat:$("#e_c").value,city:$("#e_t").value,area:$("#e_a").value.trim(),phone:$("#e_p").value.trim(),license:$("#e_l").value.trim(),comm:+$("#e_m").value||0};if(ok)u.status="approved";try{await db.doc("vendors/"+apv).update(u);toast("تم الحفظ");if(ok)apv=null;vAdmin()}catch(e){alert("فشل")}}

init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
